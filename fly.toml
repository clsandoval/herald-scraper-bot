# Stable scheduled reports. Template only; deployment is an explicit operation.
app = "herald-scraper-bot"
primary_region = "sea"
kill_signal = "SIGTERM"
kill_timeout = "30s"
[build]
  dockerfile = "Dockerfile"
[env]
  HERALD_REPORT_DB = "/data/herald-reports.db"
[processes]
  reports = "python -m herald scheduled --loop"
[mounts]
  source = "herald_reports"
  destination = "/data"
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
