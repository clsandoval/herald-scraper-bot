[project]
name = "daimon-adapter-discord"
version = "0.0.0"
description = "Herald Reviews Scout — Discord adapter (minimal mention-gated boot)"
requires-python = ">=3.12"
dependencies = [
    "daimon-core",
    "discord.py>=2.7,<3",
    "structlog>=24",
    "anthropic>=0.96",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daimon"]
