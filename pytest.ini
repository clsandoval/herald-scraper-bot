[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
markers =
    unit: Unit tests with mocks only
    integration: Integration tests requiring real services  
    live: Live tests requiring real Discord bot token
    slow: Tests that take significant time

asyncio_mode = auto