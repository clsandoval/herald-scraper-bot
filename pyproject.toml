[project]
name = "herald-scraper-bot"
version = "0.1.0"
description = "Herald match reports and an experimental private match menu"
requires-python = ">=3.12"
dependencies = ["discord.py>=2.7,<3", "httpx>=0.27,<1", "matplotlib>=3.9,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["herald"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".planning", "experiments", "spikes"]
