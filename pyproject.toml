[project]
name = "herald-scraper-bot"
version = "0.1.0"
description = "Herald Discord Bot with periodic reporting and interactive analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.11.7",
    "openai>=1.58.1",
    "pypika>=0.48.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0", 
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "aioresponses>=0.7.4",
    "freezegun>=1.2.2",
    "factory-boy>=3.3.0",
    "ruff>=0.1.0"
]
