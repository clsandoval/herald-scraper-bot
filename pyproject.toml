[project]
name = "herald-scraper-bot"
version = "0.0.0"
description = "Herald Reviews Scout — trimmed daimon fork, workspace root"
requires-python = ">=3.12"
dependencies = [
    "daimon-core",
    "daimon-adapter-discord",
]

[tool.uv.workspace]
members = ["packages/core", "packages/adapters/*"]

[tool.uv.sources]
daimon-core = { workspace = true }
daimon-adapter-discord = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".planning",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests favour long, descriptive assert messages over a hard column cap.
"**/tests/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
