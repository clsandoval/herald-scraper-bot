[project]
name = "daimon-core"
version = "0.0.0"
description = "Herald Reviews Scout — trimmed daimon core library"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.96",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
    "tenacity>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daimon"]
