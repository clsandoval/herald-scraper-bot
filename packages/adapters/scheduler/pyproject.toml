[project]
name = "daimon-adapter-scheduler"
version = "0.0.0"
description = "Herald Reviews Scout — scheduler adapter (kept inert for Phase 3 ingestion reuse)"
requires-python = ">=3.12"
dependencies = [
    "daimon-core",
    "anthropic>=0.96",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24",
]

[project.scripts]
daimon-scheduler = "daimon.adapters.scheduler.main:run_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daimon"]
