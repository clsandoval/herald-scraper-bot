# Experimental menu + ingest share one SQLite volume on one machine.
# Template only; no machines were started as part of the handoff.
app = "herald-board"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"
[build]
  dockerfile = "Dockerfile"
[env]
  HERALD_DB = "/data/herald.db"
[processes]
  board = "python -m herald.menu_service"
[mounts]
  source = "herald_data"
  destination = "/data"
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
