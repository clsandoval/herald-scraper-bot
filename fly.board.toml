# Herald board + ingest — v1 SQLite stack (menu board, no chatbot).
# Deploy: fly deploy -c fly.board.toml
# Promote to prod channel: fly secrets set BOARD_CHANNEL=<prod channel id> -a herald-board

app            = "herald-board"
primary_region = "sjc"
kill_signal    = "SIGTERM"
kill_timeout   = "30s"

[build]
  dockerfile = "Dockerfile.board"

[env]
  HERALD_DB = "/data/herald.db"

[mounts]
  source      = "herald_data"
  destination = "/data"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "1gb"
