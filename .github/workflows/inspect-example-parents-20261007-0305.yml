name: Inspect two existing Herald parents read-only
permissions:
  contents: read
concurrency:
  group: herald-inspect-parents-20261007-0305
  cancel-in-progress: false
jobs:
  clean:
    if: ${{ github.repository == 'clsandoval/herald-scraper-bot' && github.event.created == true && github.event.deleted == false && github.event.forced == false && github.event.before == '0000000000000000000000000000000000000000' && github.run_number == '1' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Prepare reviewed read-only diagnostic
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/inspect.py\" <<'DIAG_HERALD'\n#!/usr/bin/env python3\n\"\"\"Read-only diagnosis of two fixed, receipt-bound synthetic Discord parents.\"\"\"\nimport copy\nimport hashlib\nimport json\nimport os\nimport sys\nfrom urllib.error import HTTPError, URLError\nfrom urllib.request import HTTPRedirectHandler, HTTPSHandler, ProxyHandler, Request, build_opener\n\nAPI = \"https://discord.com/api/v10\"\nBOT_ID = \"1393107291741618359\"\nCHANNEL_ID = \"1392724276334825584\"\nGUILD_ID = \"1392724275538038826\"\nMESSAGE_IDS = (\"1557223202902515713\", \"1557223226663505994\")\nORIGINAL_EMBEDS = {'1557223202902515713': [{'color': 13148220,\n                          'description': 'Scored build evidence. Invented match and reference '\n                                         'data; two team images in the thread.',\n                          'fields': [{'inline': True, 'name': '⏱️ Duration', 'value': '82m 0s'},\n                                     {'inline':\
        \ True,\n                                      'name': '⚔️ Kills',\n                                      'value': '122 · 1.49/min'},\n                                     {'inline': False,\n                                      'name': '\U0001F50E Review cues',\n                                      'value': '• <:h_antimage:1525034761998041229> Anti-Mage · '\n                                               '<:i_armlet:1525035281844011049> Armlet of '\n                                               'Mordiggian @20m · PMI 5.4\\n'\n                                               '• <:h_antimage:1525034761998041229> Anti-Mage · '\n                                               'pick 1: Counterspell · surprisal 2.3'},\n                                     {'inline': False,\n                                      'name': 'Reference population',\n                                      'value': 'Synthetic · 40 generated matches · invented patch '\n                                          \
        \     '1 · target held out.'}],\n                          'footer': {'text': 'SYNTHETIC EXAMPLE · invented data; not a quality '\n                                             'score'},\n                          'title': '\U0001F9EA EXAMPLE 1 · Synthetic Herald report'}],\n '1557223226663505994': [{'color': 13148220,\n                          'description': 'Cold start and missing evidence. Invented match and '\n                                         'reference data; two team images in the thread.',\n                          'fields': [{'inline': True, 'name': '⏱️ Duration', 'value': '82m 0s'},\n                                     {'inline': True,\n                                      'name': '⚔️ Kills',\n                                      'value': '122 · 1.49/min'},\n                                     {'inline': False,\n                                      'name': '\U0001F50E Review cues',\n                                      'value': 'No standout cue recorded.'},\n\
        \                                     {'inline': False,\n                                      'name': 'Reference population',\n                                      'value': 'Synthetic · 0 matches. Unscored does not mean '\n                                               'normal; missing logs stay unavailable.'}],\n                          'footer': {'text': 'SYNTHETIC EXAMPLE · invented data; not a quality '\n                                             'score'},\n                          'title': '\U0001F9EA EXAMPLE 2 · Synthetic Herald report'}]}\n\nclass Stop(Exception):\n    pass\n\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self, *args, **kwargs):\n        return None\n\nclass ReadOnlyDiscord:\n    def __init__(self, token):\n        self.token = token\n        self.opener = build_opener(ProxyHandler({}), HTTPSHandler(), NoRedirect())\n\n    def get(self, path):\n        allowed = {\"/users/@me\", f\"/channels/{CHANNEL_ID}\"} | {\n            f\"/channels/{CHANNEL_ID}/messages/{mid}\"\
        \ for mid in MESSAGE_IDS}\n        if path not in allowed:\n            raise Stop(\"Read route outside fixed allowlist.\")\n        req = Request(API + path, method=\"GET\", headers={\n            \"Authorization\": \"Bot \" + self.token,\n            \"User-Agent\": \"HeraldFixedParentInspect/1.0\",\n        })\n        try:\n            with self.opener.open(req, timeout=25) as response:\n                if response.status != 200:\n                    raise Stop(f\"GET {path}: HTTP {response.status}\")\n                body = response.read(2_000_001)\n        except HTTPError as exc:\n            raise Stop(f\"GET {path}: HTTP {exc.code}; no retry.\") from None\n        except (URLError, OSError, TimeoutError):\n            raise Stop(f\"GET {path}: transport failure; no retry.\") from None\n        if len(body) > 2_000_000:\n            raise Stop(\"Oversized response.\")\n        try:\n            result = json.loads(body)\n        except (ValueError, UnicodeError):\n      \
        \      raise Stop(\"Invalid JSON response.\") from None\n        if not isinstance(result, dict):\n            raise Stop(\"Response is not an object.\")\n        return result\n\n\ndef normalize(embeds):\n    # Same narrow normalization as the reviewed editor, with no mutation capability.\n    if not isinstance(embeds, list) or len(embeds) != 1 or not isinstance(embeds[0], dict):\n        raise Stop(\"Unexpected embed count/type.\")\n    result = copy.deepcopy(embeds)\n    for embed in result:\n        if \"type\" in embed and embed.pop(\"type\") != \"rich\":\n            raise Stop(\"Unexpected embed type.\")\n        if \"flags\" in embed and embed.pop(\"flags\") != 0:\n            raise Stop(\"Unexpected embed flags.\")\n        for field in embed.get(\"fields\", []):\n            if isinstance(field, dict):\n                field.setdefault(\"inline\", False)\n        for name in (\"author\", \"thumbnail\", \"footer\"):\n            media = embed.get(name)\n            if media\
        \ is None:\n                continue\n            if not isinstance(media, dict):\n                raise Stop(\"Unexpected embed media type.\")\n            if \"flags\" in media and media[\"flags\"] != 0:\n                raise Stop(\"Unexpected media flags.\")\n            if \"content_type\" in media and media[\"content_type\"] != \"image/png\":\n                raise Stop(\"Unexpected media content type.\")\n            for key in (\"proxy_icon_url\", \"proxy_url\", \"width\", \"height\", \"flags\",\n                        \"content_type\", \"placeholder\", \"placeholder_version\"):\n                media.pop(key, None)\n    return result\n\n\ndef differences(expected, actual, path=\"embeds\"):\n    if type(expected) is not type(actual):\n        return [{\"path\": path, \"expected\": expected, \"actual\": actual}]\n    if isinstance(expected, dict):\n        result = []\n        for key in sorted(set(expected) | set(actual)):\n            child = path + \".\" + key\n      \
        \      if key not in expected:\n                result.append({\"path\": child, \"expected_missing\": True, \"actual\": actual[key]})\n            elif key not in actual:\n                result.append({\"path\": child, \"expected\": expected[key], \"actual_missing\": True})\n            else:\n                result.extend(differences(expected[key], actual[key], child))\n        return result\n    if isinstance(expected, list):\n        result = []\n        for index in range(max(len(expected), len(actual))):\n            child = f\"{path}[{index}]\"\n            if index >= len(expected):\n                result.append({\"path\": child, \"expected_missing\": True, \"actual\": actual[index]})\n            elif index >= len(actual):\n                result.append({\"path\": child, \"expected\": expected[index], \"actual_missing\": True})\n            else:\n                result.extend(differences(expected[index], actual[index], child))\n        return result\n    return [] if expected\
        \ == actual else [{\"path\": path, \"expected\": expected, \"actual\": actual}]\n\n\ndef inspect(client):\n    bot = client.get(\"/users/@me\")\n    if bot.get(\"id\") != BOT_ID or bot.get(\"bot\") is not True:\n        raise Stop(\"Bot identity differs from receipt-bound bot.\")\n    channel = client.get(f\"/channels/{CHANNEL_ID}\")\n    if channel.get(\"id\") != CHANNEL_ID or channel.get(\"guild_id\") != GUILD_ID or channel.get(\"type\") != 0:\n        raise Stop(\"Channel/guild differs from fixed destination.\")\n    result = {\"mode\": \"read-only-inspect\", \"http_methods\": [\"GET\"], \"bot_id\": BOT_ID,\n              \"channel_id\": CHANNEL_ID, \"parents\": []}\n    for mid in MESSAGE_IDS:\n        message = client.get(f\"/channels/{CHANNEL_ID}/messages/{mid}\")\n        author = message.get(\"author\", {})\n        if (message.get(\"id\") != mid or message.get(\"channel_id\") != CHANNEL_ID or\n                author.get(\"id\") != BOT_ID or author.get(\"bot\") is not True\
        \ or\n                message.get(\"webhook_id\") or message.get(\"type\") != 0):\n            raise Stop(\"Parent identity differs from fixed fixture.\")\n        # Do not print arbitrary message contents, user data, headers, or full responses.\n        if message.get(\"content\", \"\") or message.get(\"attachments\", []) or message.get(\"components\", []):\n            raise Stop(\"Parent has unexpected content/attachments/components; nothing printed.\")\n        authored = normalize(message.get(\"embeds\"))\n        expected = normalize(ORIGINAL_EMBEDS[mid])\n        result[\"parents\"].append({\"message_id\": mid, \"normalized_embeds\": authored,\n                                  \"differences_from_original\": differences(expected, authored)})\n    return result\n\n\ndef main():\n    token = \"\"\n    try:\n        if (os.environ.get(\"GITHUB_ACTIONS\") != \"true\" or\n                os.environ.get(\"GITHUB_REPOSITORY\") != \"clsandoval/herald-scraper-bot\" or\n           \
        \     os.environ.get(\"GITHUB_RUN_ATTEMPT\") != \"1\" or os.environ.get(\"RUNNER_DEBUG\") == \"1\"):\n            raise Stop(\"Read-only inspection requires the expected first-attempt non-debug GitHub runner.\")\n        token = os.environ.get(\"DISCORD_BOT_TOKEN\", \"\")\n        if not token or any(c.isspace() for c in token):\n            raise Stop(\"Missing/invalid runner secret environment.\")\n        result = inspect(ReadOnlyDiscord(token))\n        text = json.dumps(result, ensure_ascii=False, indent=2)\n        # Defense in depth against a hypothetical reflected value. No raw response is logged.\n        print(text.replace(token, \"[REDACTED]\"))\n        return 0\n    except Stop as exc:\n        text = str(exc)\n        print(text.replace(token, \"[REDACTED]\") if token else text, file=sys.stderr)\n        return 1\n    except (OSError, ValueError, TypeError, KeyError, AttributeError):\n        print(\"Read-only inspection stopped on an unexpected response shape; no writes\
        \ occurred.\", file=sys.stderr)\n        return 1\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n\nDIAG_HERALD\necho 'c051c3f78082f5a9d7d49ad33965807bd1c9911297ac5b3d785c5fc91dbbb56a  '\"$RUNNER_TEMP/inspect.py\" | sha256sum -c -\npython3 -m py_compile \"$RUNNER_TEMP/inspect.py\"\n"
    - name: Read only the two fixed parents
      shell: bash
      env:
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      run: 'set +x

        set -euo pipefail

        python3 "$RUNNER_TEMP/inspect.py"

        '
'on':
  push:
    branches:
    - test/herald-inspect-parents-20261007-0305
