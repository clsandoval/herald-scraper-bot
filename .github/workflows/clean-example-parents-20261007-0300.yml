name: Clean two existing Herald example previews
permissions:
  contents: read
concurrency:
  group: herald-clean-existing-example-parents
  cancel-in-progress: false
jobs:
  clean:
    if: ${{ github.repository == 'clsandoval/herald-scraper-bot' && github.event.created == false && github.event.deleted == false && github.event.forced == false && github.event.before == '4b9eee4962cad0232fb95aee00184956e1ed2362' && github.run_number == '2' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Prepare and verify reviewed cleanup script without credentials
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\ntest \"$GITHUB_RUN_NUMBER\" = 2\ntest \"${RUNNER_DEBUG:-}\" != 1\ncat > \"$RUNNER_TEMP/clean_example_parents.py\" <<'PY_CLEAN_HERALD'\n#!/usr/bin/env python3\n\"\"\"Review a fixed two-message edit offline; --apply only in the GitHub runner.\n\nNo imports from the bot, token files, retries, creates, deletes, thread edits,\nchannel edits, uploads, webhook routes, or arbitrary destinations are supported.\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport copy\nfrom datetime import datetime, timezone\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport sys\nfrom urllib.error import HTTPError, URLError\nfrom urllib.request import HTTPRedirectHandler, HTTPSHandler, ProxyHandler, Request, build_opener\n\nAPI = \"https://discord.com/api/v10\"\nGUILD_ID = \"1392724275538038826\"\nCHANNEL_ID = \"1392724276334825584\"\nBOT_ID = \"1393107291741618359\"\nREPOSITORY = \"clsandoval/herald-scraper-bot\"\
        \nMANIFEST_VERSION = \"clean-existing-example-parents-20261007-v1\"\nSOURCE_RUN_ID = \"37563738367\"\nSOURCE_SHA = \"9136e5290c196ebc1b7bdeafd5da4d0459d3c9ab\"\nJUGGERNAUT_ICON = \"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/juggernaut.png\"\nRAPIER_ICON = \"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/rapier.png\"\n# Exact original embed bodies from the verified send-time SQLite receipts.\nORIGINAL_EMBEDS = {'1557223202902515713': [{'color': 13148220,\n                          'description': 'Scored build evidence. Invented match and reference '\n                                         'data; two team images in the thread.',\n                          'fields': [{'inline': True, 'name': '⏱️ Duration', 'value': '82m 0s'},\n                                     {'inline': True,\n                                      'name': '⚔️ Kills',\n                                      'value': '122 · 1.49/min'},\n                 \
        \                    {'inline': False,\n                                      'name': '\U0001F50E Review cues',\n                                      'value': '• <:h_antimage:1525034761998041229> Anti-Mage · '\n                                               '<:i_armlet:1525035281844011049> Armlet of '\n                                               'Mordiggian @20m · PMI 5.4\\n'\n                                               '• <:h_antimage:1525034761998041229> Anti-Mage · '\n                                               'pick 1: Counterspell · surprisal 2.3'},\n                                     {'inline': False,\n                                      'name': 'Reference population',\n                                      'value': 'Synthetic · 40 generated matches · invented patch '\n                                               '1 · target held out.'}],\n                          'footer': {'text': 'SYNTHETIC EXAMPLE · invented data; not a quality '\n                     \
        \                        'score'},\n                          'title': '\U0001F9EA EXAMPLE 1 · Synthetic Herald report'}],\n '1557223226663505994': [{'color': 13148220,\n                          'description': 'Cold start and missing evidence. Invented match and '\n                                         'reference data; two team images in the thread.',\n                          'fields': [{'inline': True, 'name': '⏱️ Duration', 'value': '82m 0s'},\n                                     {'inline': True,\n                                      'name': '⚔️ Kills',\n                                      'value': '122 · 1.49/min'},\n                                     {'inline': False,\n                                      'name': '\U0001F50E Review cues',\n                                      'value': 'No standout cue recorded.'},\n                                     {'inline': False,\n                                      'name': 'Reference population',\n                     \
        \                 'value': 'Synthetic · 0 matches. Unscored does not mean '\n                                               'normal; missing logs stay unavailable.'}],\n                          'footer': {'text': 'SYNTHETIC EXAMPLE · invented data; not a quality '\n                                             'score'},\n                          'title': '\U0001F9EA EXAMPLE 2 · Synthetic Herald report'}]}\nMANIFEST = (\n    {\n        \"example\": 1,\n        \"match_id\": -101,\n        \"message_id\": \"1557223202902515713\",\n        \"payload\": {\"embeds\": [{\n            \"author\": {\"name\": \"Juggernaut\", \"icon_url\": JUGGERNAUT_ICON},\n            \"title\": \"Rapier → dead in 35s\",\n            \"description\": \"82m · 122 kills\",\n            \"color\": 13148220,\n            \"thumbnail\": {\"url\": RAPIER_ICON},\n            \"footer\": {\"text\": \"Example\"},\n        }]},\n    },\n    {\n        \"example\": 2,\n        \"match_id\": -102,\n        \"message_id\"\
        : \"1557223226663505994\",\n        \"payload\": {\"embeds\": [{\n            \"title\": \"122 kills in 82 minutes\",\n            \"description\": \"Radiant 55 · Dire 67\",\n            \"color\": 13148220,\n            \"footer\": {\"text\": \"Example\"},\n        }]},\n    },\n)\nEXPECTED_MESSAGE_IDS = (\"1557223202902515713\", \"1557223226663505994\")\nPROTECTED_KEYS = (\"content\", \"attachments\", \"components\", \"flags\", \"pinned\", \"tts\",\n                  \"mention_everyone\", \"mention_roles\", \"mentions\", \"message_reference\", \"sticker_items\")\n\n\nclass Stop(Exception):\n    \"\"\"A deliberately bounded, secret-free diagnostic.\"\"\"\n\n\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        # Never forward the Authorization header to a redirect destination.\n        return None\n\n\ndef canonical(value):\n    return json.dumps(value, sort_keys=True, separators=(\",\", \":\"), ensure_ascii=False)\n\
        \n\ndef digest(value):\n    return hashlib.sha256(canonical(value).encode()).hexdigest()\n\n\ndef message_path(message_id):\n    if message_id not in EXPECTED_MESSAGE_IDS:\n        raise Stop(\"Message ID is outside the fixed manifest.\")\n    return f\"/channels/{CHANNEL_ID}/messages/{message_id}\"\n\n\ndef validate_route(method, path):\n    parents = {message_path(mid) for mid in EXPECTED_MESSAGE_IDS}\n    if (method == \"GET\" and path in parents | {\"/users/@me\", f\"/channels/{CHANNEL_ID}\"}) or (\n        method == \"PATCH\" and path in parents\n    ):\n        return\n    raise Stop(\"HTTP operation is outside the fixed read/edit allowlist.\")\n\n\ndef validate_payload(payload, expected):\n    if payload != expected or set(payload) != {\"embeds\"}:\n        raise Stop(\"PATCH must contain exactly the reviewed replacement embeds.\")\n    embeds = payload[\"embeds\"]\n    if not isinstance(embeds, list) or len(embeds) != 1:\n        raise Stop(\"Exactly one replacement embed\
        \ is required.\")\n    embed = embeds[0]\n    allowed = {\"title\", \"description\", \"color\", \"footer\", \"author\", \"thumbnail\"}\n    if not set(embed) <= allowed or \"fields\" in embed:\n        raise Stop(\"Unreviewed embed shape.\")\n    if not (0 < len(embed[\"title\"]) <= 256 and 0 < len(embed[\"description\"]) <= 4096):\n        raise Stop(\"Invalid embed text length.\")\n    if embed.get(\"footer\") != {\"text\": \"Example\"}:\n        raise Stop(\"Only the single Example label is permitted.\")\n    text = canonical(embed).lower()\n    for word in (\"reference\", \"pmi\", \"surprisal\", \"n=\", \"unscored\", \"unavailable\",\n                 \"quality score\", \"synthetic\", \"review cues\", \"held out\"):\n        if word in text:\n            raise Stop(\"Technical or disclaimer copy is forbidden in replacement embeds.\")\n    if \"author\" in embed and embed[\"author\"] != {\"name\": \"Juggernaut\", \"icon_url\": JUGGERNAUT_ICON}:\n        raise Stop(\"Unreviewed\
        \ author or icon.\")\n    if \"thumbnail\" in embed and embed[\"thumbnail\"] != {\"url\": RAPIER_ICON}:\n        raise Stop(\"Unreviewed thumbnail.\")\n    if len(canonical(embed)) > 6000:\n        raise Stop(\"Embed exceeds the conservative size limit.\")\n\n\ndef validate_manifest():\n    if tuple(t[\"message_id\"] for t in MANIFEST) != EXPECTED_MESSAGE_IDS:\n        raise Stop(\"Fixed message manifest changed.\")\n    if tuple(t[\"match_id\"] for t in MANIFEST) != (-101, -102):\n        raise Stop(\"Fixed fixture identities changed.\")\n    if set(ORIGINAL_EMBEDS) != set(EXPECTED_MESSAGE_IDS):\n        raise Stop(\"Original receipt fixtures are incomplete.\")\n    for target in MANIFEST:\n        validate_payload(target[\"payload\"], target[\"payload\"])\n\n\ndef normalize_embeds(value):\n    \"\"\"Strip only documented server-derived media properties, never visible copy.\"\"\"\n    if not isinstance(value, list) or len(value) != 1 or not isinstance(value[0], dict):\n        raise\
        \ Stop(\"Unexpected returned embed count or type.\")\n    embeds = copy.deepcopy(value)\n    for embed in embeds:\n        if \"type\" in embed:\n            if embed.pop(\"type\") != \"rich\":\n                raise Stop(\"Unexpected returned embed type.\")\n        if \"flags\" in embed and embed.pop(\"flags\") != 0:\n            raise Stop(\"Unexpected non-neutral embed flags.\")\n        # Read-only live inspection of both fixed parents observed this exact\n        # server scan marker; it is not authored embed content.\n        if \"content_scan_version\" in embed:\n            version = embed.pop(\"content_scan_version\")\n            if type(version) is not int or version != 4:\n                raise Stop(\"Unexpected embed content scan version.\")\n        for field in embed.get(\"fields\", []):\n            if isinstance(field, dict):\n                field.setdefault(\"inline\", False)\n        for field, allowed in ((\"author\", {\"name\", \"icon_url\", \"url\", \"proxy_icon_url\"\
        }),\n                               (\"thumbnail\", {\"url\", \"proxy_url\", \"width\", \"height\", \"flags\",\n                                              \"content_type\", \"placeholder\", \"placeholder_version\"}),\n                               (\"footer\", {\"text\", \"icon_url\", \"proxy_icon_url\"})):\n            if field not in embed:\n                continue\n            media = embed[field]\n            if not isinstance(media, dict) or not set(media) <= allowed:\n                raise Stop(\"Unexpected returned embed metadata shape.\")\n            if \"flags\" in media and media[\"flags\"] != 0:\n                raise Stop(\"Unexpected non-neutral media flags.\")\n            if \"content_type\" in media and media[\"content_type\"] != \"image/png\":\n                raise Stop(\"Unexpected media content type.\")\n            for key in (\"proxy_icon_url\", \"proxy_url\", \"width\", \"height\", \"flags\",\n                        \"content_type\", \"placeholder\"\
        , \"placeholder_version\"):\n                media.pop(key, None)\n    return embeds\n\n\ndef verify_identity(message, target):\n    if not isinstance(message, dict):\n        raise Stop(\"Discord did not return a message object.\")\n    if message.get(\"id\") != target[\"message_id\"] or message.get(\"channel_id\") != CHANNEL_ID:\n        raise Stop(\"Message ID or channel did not match the receipt fixture.\")\n    author = message.get(\"author\", {})\n    if author.get(\"id\") != BOT_ID or author.get(\"bot\") is not True or message.get(\"webhook_id\"):\n        raise Stop(\"Message author did not match the receipt-bound bot.\")\n    if message.get(\"type\") != 0:\n        raise Stop(\"Target is not a normal parent message.\")\n    if message.get(\"content\", \"\") != \"\" or message.get(\"components\", []) != []:\n        raise Stop(\"Unexpected content or components on a parent message.\")\n    if message.get(\"attachments\", []) != []:\n        # No attachment field is ever PATCHed;\
        \ stop for review if one was added.\n        raise Stop(\"Unexpected parent attachment; preserve it and stop for review.\")\n    if message.get(\"flags\", 0) & (4 | 32768):\n        raise Stop(\"Parent embeds are suppressed or the parent uses Components V2.\")\n\n\ndef protected_state(message):\n    return {key: copy.deepcopy(message[key]) for key in PROTECTED_KEYS if key in message}\n\n\ndef verify_current(message, target):\n    verify_identity(message, target)\n    embeds = normalize_embeds(message.get(\"embeds\"))\n    if embeds == target[\"payload\"][\"embeds\"]:\n        return \"already_clean\"\n    if embeds != ORIGINAL_EMBEDS[target[\"message_id\"]]:\n        raise Stop(\"Current embed differs from both the sent fixture and the reviewed replacement.\")\n    return \"original\"\n\n\ndef verify_after(message, target, before):\n    verify_identity(message, target)\n    if normalize_embeds(message.get(\"embeds\")) != target[\"payload\"][\"embeds\"]:\n        raise Stop(\"Readback\
        \ did not match the exact reviewed replacement embeds.\")\n    if protected_state(message) != protected_state(before):\n        raise Stop(\"A protected message property changed; stop without rollback.\")\n\n\nclass Discord:\n    def __init__(self, token):\n        self._token = token\n        self._opener = build_opener(ProxyHandler({}), HTTPSHandler(), NoRedirect())\n\n    def request(self, method, path, payload=None):\n        validate_route(method, path)\n        if method == \"PATCH\":\n            target = next(t for t in MANIFEST if message_path(t[\"message_id\"]) == path)\n            validate_payload(payload, target[\"payload\"])\n        elif payload is not None:\n            raise Stop(\"GET requests may not carry a body.\")\n        body = None if payload is None else canonical(payload).encode()\n        request = Request(API + path, data=body, method=method, headers={\n            \"Authorization\": \"Bot \" + self._token,\n            \"Content-Type\": \"application/json\"\
        ,\n            \"User-Agent\": \"HeraldFixedParentCleanup/1.0\",\n        })\n        try:\n            with self._opener.open(request, timeout=25) as response:\n                status = response.status\n                raw = response.read(2_000_001)\n        except HTTPError as exc:\n            # Never log headers, raw bodies, URLs returned by the server, token,\n            # arbitrary server message text, or exception repr. Status and code\n            # retain the exact API error while excluding reflected secrets.\n            status = exc.code\n            try:\n                error = json.loads(exc.read(16_384))\n            except (ValueError, OSError):\n                error = {}\n            code = error.get(\"code\") if isinstance(error, dict) else None\n            suffix = f\"; Discord code {code}\" if type(code) is int else \"\"\n            raise Stop(f\"{method} {path}: HTTP {status}{suffix}; stopped without retry.\") from None\n        except (URLError, OSError,\
        \ TimeoutError):\n            raise Stop(f\"{method} {path}: transport failure; outcome may be uncertain; no retry.\") from None\n        if status != 200:\n            raise Stop(f\"{method} {path}: unexpected HTTP {status}; stopped without retry.\")\n        if len(raw) > 2_000_000:\n            raise Stop(f\"{method} {path}: oversized response; stopped without retry.\")\n        try:\n            result = json.loads(raw)\n        except (ValueError, UnicodeError):\n            raise Stop(f\"{method} {path}: invalid JSON response; stopped without retry.\") from None\n        if not isinstance(result, dict):\n            raise Stop(f\"{method} {path}: response was not an object; stopped without retry.\")\n        return result\n\n\ndef now():\n    return datetime.now(timezone.utc).isoformat()\n\n\ndef preview():\n    validate_manifest()\n    return {\n        \"mode\": \"dry-run\", \"network_calls\": 0, \"manifest_version\": MANIFEST_VERSION,\n        \"manifest_sha256\": digest(MANIFEST),\
        \ \"guild_id\": GUILD_ID, \"channel_id\": CHANNEL_ID,\n        \"expected_bot_id\": BOT_ID, \"source_run_id\": SOURCE_RUN_ID, \"source_sha\": SOURCE_SHA,\n        \"targets\": [{\"example\": t[\"example\"], \"message_id\": t[\"message_id\"],\n                     \"method\": \"PATCH\", \"path\": message_path(t[\"message_id\"]),\n                     \"payload\": t[\"payload\"]} for t in MANIFEST],\n    }\n\n\ndef apply(client, save):\n    \"\"\"Injectable transport and audit sink allow fully offline safety tests.\"\"\"\n    validate_manifest()\n    audit = {\"mode\": \"apply\", \"manifest_version\": MANIFEST_VERSION,\n             \"manifest_sha256\": digest(MANIFEST), \"status\": \"preflight\", \"started_at\": now(),\n             \"channel_id\": CHANNEL_ID, \"expected_bot_id\": BOT_ID,\n             \"targets\": [{\"message_id\": t[\"message_id\"], \"status\": \"pending\"} for t in MANIFEST]}\n    save(audit)\n    try:\n        bot = client.request(\"GET\", \"/users/@me\")\n  \
        \      if bot.get(\"id\") != BOT_ID or bot.get(\"bot\") is not True:\n            raise Stop(\"Authenticated bot does not match the verified receipt-bound bot.\")\n        channel = client.request(\"GET\", f\"/channels/{CHANNEL_ID}\")\n        if channel.get(\"id\") != CHANNEL_ID or channel.get(\"guild_id\") != GUILD_ID or channel.get(\"type\") != 0:\n            raise Stop(\"Channel/guild is not the fixed text-channel destination.\")\n        # Preflight BOTH parents before the first write.\n        before = {}\n        for target in MANIFEST:\n            message = client.request(\"GET\", message_path(target[\"message_id\"]))\n            state = verify_current(message, target)\n            before[target[\"message_id\"]] = message\n            audit[\"targets\"][target[\"example\"] - 1][\"status\"] = state\n        save(audit)\n        for target, receipt in zip(MANIFEST, audit[\"targets\"]):\n            path = message_path(target[\"message_id\"])\n            original = before[target[\"\
        message_id\"]]\n            if receipt[\"status\"] == \"already_clean\":\n                verify_after(original, target, original)\n                continue\n            # Refuse concurrent edits immediately before PATCHing each target.\n            current = client.request(\"GET\", path)\n            if normalize_embeds(current.get(\"embeds\")) != normalize_embeds(original.get(\"embeds\")):\n                raise Stop(\"Parent embeds changed after preflight; stopped without overwrite.\")\n            verify_identity(current, target)\n            if protected_state(current) != protected_state(original):\n                raise Stop(\"Protected parent properties changed after preflight.\")\n            receipt[\"status\"] = \"patch_started_outcome_unconfirmed\"\n            save(audit)  # Durable intent before any write.\n            response = client.request(\"PATCH\", path, copy.deepcopy(target[\"payload\"]))\n            verify_after(response, target, original)\n            readback\
        \ = client.request(\"GET\", path)\n            verify_after(readback, target, original)\n            receipt.update(status=\"verified\", embed_sha256=digest(target[\"payload\"][\"embeds\"]))\n            save(audit)\n        audit.update(status=\"verified\", finished_at=now())\n        save(audit)\n        return audit\n    except Stop as exc:\n        audit.update(status=\"stopped\", error=str(exc), finished_at=now(),\n                     retry_policy=\"Do not rerun automatically. Reconcile existing IDs before any retry.\")\n        save(audit)\n        raise\n\n\nclass AuditFile:\n    def __init__(self, directory):\n        directory.mkdir(mode=0o700, parents=True, exist_ok=True)\n        self.path = directory / \"parent-cleanup-result.json\"\n        # Never overwrite an earlier/uncertain operation's audit.\n        with self.path.open(\"x\", encoding=\"utf-8\") as stream:\n            stream.write('{\"status\":\"initialized\"}\\n')\n            stream.flush()\n            os.fsync(stream.fileno())\n\
        \        self.path.chmod(0o600)\n\n    def __call__(self, data):\n        temporary = self.path.with_suffix(\".tmp\")\n        with temporary.open(\"w\", encoding=\"utf-8\") as stream:\n            stream.write(json.dumps(data, ensure_ascii=False, indent=2) + \"\\n\")\n            stream.flush()\n            os.fsync(stream.fileno())\n        temporary.chmod(0o600)\n        temporary.replace(self.path)\n\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser(description=__doc__)\n    mode = parser.add_mutually_exclusive_group()\n    mode.add_argument(\"--dry-run\", action=\"store_true\", help=\"Offline preview (the default).\")\n    mode.add_argument(\"--apply\", action=\"store_true\", help=\"Edit the two fixed IDs in GitHub Actions only.\")\n    parser.add_argument(\"--audit-dir\", type=Path, help=\"Required for apply; receipt must not already exist.\")\n    args = parser.parse_args(argv)\n    try:\n        if not args.apply:\n            print(json.dumps(preview(), ensure_ascii=False,\
        \ indent=2))\n            return 0\n        if (os.environ.get(\"GITHUB_ACTIONS\") != \"true\" or\n                os.environ.get(\"GITHUB_REPOSITORY\") != REPOSITORY or\n                os.environ.get(\"GITHUB_RUN_ATTEMPT\") != \"1\" or\n                os.environ.get(\"RUNNER_DEBUG\") == \"1\"):\n            raise Stop(\"Apply requires the authorized repository's non-debug, first-attempt GitHub runner.\")\n        if args.audit_dir is None:\n            raise Stop(\"Apply requires --audit-dir for a durable, secret-free receipt.\")\n        token = os.environ.get(\"DISCORD_BOT_TOKEN\", \"\")\n        if not token.strip() or token != token.strip() or any(c.isspace() for c in token):\n            raise Stop(\"DISCORD_BOT_TOKEN must be supplied only by the runner's secret environment.\")\n        save = AuditFile(args.audit_dir)\n        result = apply(Discord(token), save)\n        print(json.dumps(result, ensure_ascii=False, indent=2))\n        return 0\n    except Stop as exc:\n\
        \        print(str(exc), file=sys.stderr)\n        return 1\n    except (OSError, ValueError, TypeError, KeyError):\n        # Do not print arbitrary exception details or any raw API response.\n        print(\"Local validation/audit failure. Stop and inspect the receipt; do not retry automatically.\", file=sys.stderr)\n        return 1\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\nPY_CLEAN_HERALD\necho '0f00a4fa6dc9180dba307644c451ace399fb14153b35c1791e2c77aa94353eef  '\"$RUNNER_TEMP/clean_example_parents.py\" | sha256sum -c -\npython3 -m py_compile \"$RUNNER_TEMP/clean_example_parents.py\"\npython3 \"$RUNNER_TEMP/clean_example_parents.py\" --dry-run\n"
    - name: Edit only the two verified parent messages and verify readback
      shell: bash
      env:
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      run: 'set +x

        set -euo pipefail

        python3 "$RUNNER_TEMP/clean_example_parents.py" --apply --audit-dir "$RUNNER_TEMP/herald-parent-cleanup"

        '
    - name: Print only the secret-free operation receipt
      if: ${{ always() }}
      shell: bash
      run: "if test -f \"$RUNNER_TEMP/herald-parent-cleanup/parent-cleanup-result.json\"; then\n  cat \"$RUNNER_TEMP/herald-parent-cleanup/parent-cleanup-result.json\"\nfi\n"
'on':
  push:
    branches:
    - test/herald-clean-parents-20261007-0300
