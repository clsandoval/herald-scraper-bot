# fly.toml app configuration file
# See https://fly.io/docs/reference/configuration/

app = "herald-scraper-bot"
primary_region = "iad"  # US East (Virginia) - change as needed
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "src/infra/Dockerfile"

[env]
  # Python environment
  PYTHONUNBUFFERED = "1"
  # Discord bot settings
  BOT_ENV = "production"

[experimental]
  # Enable auto rollback on deploy failure
  auto_rollback = true

[[services]]
  # Discord bots don't need HTTP services
  # But Fly.io requires at least one service definition
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  # VM configuration - optimized for Discord bot
  # 256MB should be sufficient for a Discord bot with caching
  memory = "512mb"  # Start with 512MB, can reduce to 256MB if stable
  cpu_kind = "shared"
  cpus = 1

[checks]
  # Health check to ensure bot stays running
  [checks.bot_health]
    grace_period = "30s"
    interval = "30s"
    method = "get"
    path = "/health"  # You'll need to add a simple health endpoint
    port = 8080
    timeout = "5s"
    type = "http"

[deploy]
  # Deployment strategy
  strategy = "rolling"
  max_unavailable = 0  # Keep bot always running during deploys

[mounts]
  # Persistent storage for logs
  source = "herald_logs"
  destination = "/app/logs"

[metrics]
  # Enable metrics collection
  port = 9091
  path = "/metrics"

# Restart policy
[restart]
  policy = "always"
  max_retries = 10

# Process monitoring
[[processes]]
  name = "bot"
  # The main bot process - handled by CMD in Dockerfile